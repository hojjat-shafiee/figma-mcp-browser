name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Chrome extension zip
        run: |
          zip figma-mcp-bridge-${{ steps.version.outputs.VERSION }}.zip \
            manifest.json \
            background.js \
            content.js \
            inject.js

      - name: Build MCP server tarball
        run: |
          tar -czf figma-mcp-server-${{ steps.version.outputs.VERSION }}.tar.gz \
            -C server \
            index.js \
            package.json \
            package-lock.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Figma MCP Bridge $GITHUB_REF_NAME" \
            --generate-notes \
            figma-mcp-bridge-${{ steps.version.outputs.VERSION }}.zip \
            figma-mcp-server-${{ steps.version.outputs.VERSION }}.tar.gz
